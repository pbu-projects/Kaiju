name: Release PDFs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to attach PDFs to'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pdf-release:
    name: Compile and Upload Documentation PDFs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}
          fetch-depth: 0

      - name: Verify tag is on main branch
        env:
          TAG_NAME: ${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref_name }}
        run: |
          git fetch origin main
          COMMIT_SHA=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "${COMMIT_SHA}" origin/main; then
            echo "Commit ${COMMIT_SHA} for tag ${TAG_NAME} is not on the main branch. Skipping release."
            exit 1
          fi
          echo "Verified: tag ${TAG_NAME} (${COMMIT_SHA}) is on the main branch."

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.7.1
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@6cfc8b8e8bb586cc164bef1c478c1eea3a4d6a19 # v4.4.2

      - name: Compile Documentation PDFs
        run: ./gradlew asciidoctorPdf --no-daemon

      - name: Upload PDFs to Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref_name }}
          files: |
            build/docs/asciidoctor-pdf/*.pdf
