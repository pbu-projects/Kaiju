<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaiju - Volunteer Project Discovery</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌟</text></svg>">
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    />
    <style>
        :root {
            --bg: #ffffff;
            --bg-subtle: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --text-subtle: #64748b;
            --border: #cbd5e1;
            --border-light: #e2e8f0;
            --teal-700: #0f766e;
            --teal-800: #115e59;
            --teal-50: #f0fdfa;
            --teal-200: #99f6e4;
            --blue-700: #1d4ed8;
            --blue-50: #eff6ff;
            --amber-800: #92400e;
            --amber-50: #fffbeb;
            --green-800: #166534;
            --green-50: #f0fdf4;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-pill: 9999px;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
            --font-stack: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text-main);
            font-family: var(--font-stack);
            line-height: 1.45;
            -webkit-font-smoothing: antialiased;
        }

        /* 1. Calm, Focused Header */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 200;
            background: var(--bg);
            border-bottom: 1px solid var(--border-light);
            padding: 10px 16px;
        }

        .header-content {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .brand-link {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            text-decoration: none;
            color: var(--teal-700);
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: -0.02em;
            flex-shrink: 0;
        }

        .brand-badge {
            width: 28px;
            height: 28px;
            border-radius: 7px;
            background: var(--teal-700);
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.88rem;
            font-weight: 800;
        }

        /* Calm Resting Search Capsule (Tap to Expand on Mobile) */
        .search-capsule-trigger {
            flex: 1;
            max-width: 580px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-pill);
            box-shadow: var(--shadow-sm);
            padding: 6px 14px;
            cursor: pointer;
            gap: 8px;
            transition: box-shadow 0.15s ease, border-color 0.15s ease;
            text-align: left;
            font-family: inherit;
        }

        .search-capsule-trigger:hover {
            border-color: var(--teal-700);
            box-shadow: var(--shadow-md);
        }

        .search-capsule-trigger:focus-visible {
            outline: 2px solid var(--teal-700);
            outline-offset: 2px;
        }

        .capsule-main-text {
            font-size: 0.84rem;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .capsule-sub-text {
            font-size: 0.76rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .capsule-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--teal-700);
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .filter-open-btn {
            border: 1px solid var(--border);
            background: var(--bg-subtle);
            color: var(--text-main);
            border-radius: var(--radius-pill);
            padding: 6px 12px;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.15s ease;
        }

        .filter-open-btn:hover {
            background: var(--border-light);
        }

        .filter-open-btn:focus-visible {
            outline: 2px solid var(--teal-700);
            outline-offset: 2px;
        }

        .filter-count-badge {
            background: var(--teal-700);
            color: #ffffff;
            font-size: 0.7rem;
            font-weight: 700;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .map-toggle-btn {
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text-main);
            border-radius: var(--radius-pill);
            padding: 6px 12px;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: background 0.15s ease;
        }

        .map-toggle-btn:hover {
            background: var(--bg-subtle);
        }

        .map-toggle-btn:focus-visible {
            outline: 2px solid var(--teal-700);
            outline-offset: 2px;
        }

        /* 2. Sleek Active Filters Strip (Under 38px, Calm at Rest) */
        .active-filter-strip {
            background: var(--bg-subtle);
            border-bottom: 1px solid var(--border-light);
            padding: 6px 16px;
        }

        .active-filter-inner {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .active-filter-inner::-webkit-scrollbar {
            display: none;
        }

        .active-tags-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: nowrap;
        }

        .active-status-label {
            font-size: 0.78rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .active-status-label strong {
            color: var(--text-main);
            font-weight: 600;
        }

        .dismiss-pill {
            background: #ffffff;
            color: var(--teal-700);
            border: 1px solid var(--border-light);
            font-size: 0.72rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: var(--radius-pill);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            white-space: nowrap;
        }

        .dismiss-pill:hover {
            background: #fee2e2;
            color: #b91c1c;
            border-color: #fca5a5;
        }

        .reset-link-text {
            border: none;
            background: none;
            color: var(--teal-700);
            text-decoration: underline;
            font-family: inherit;
            font-size: 0.76rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            padding: 0;
        }

        /* 3. Progressive Disclosure Drawer / Overlay (Refinement Tray) */
        .tray-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(2px);
            display: none;
            align-items: flex-start;
            justify-content: center;
            padding: 16px;
            z-index: 400;
            overflow-y: auto;
        }

        .tray-overlay.open {
            display: flex;
        }

        .tray-card {
            background: var(--bg);
            border-radius: var(--radius-lg);
            max-width: 620px;
            width: 100%;
            padding: 20px 24px;
            box-shadow: var(--shadow-lg);
            margin: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .tray-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 12px;
        }

        .tray-top h3 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .tray-close-btn {
            border: none;
            background: var(--bg-subtle);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            cursor: pointer;
        }

        .tray-close-btn:focus-visible {
            outline: 2px solid var(--teal-700);
            outline-offset: 2px;
        }

        .tray-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .tray-section-title {
            font-size: 0.74rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
        }

        .tray-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .input-box-styled {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.86rem;
            outline: none;
        }

        .input-box-styled:focus {
            border-color: var(--teal-700);
            outline: 2px solid var(--teal-700);
        }

        .select-box-styled {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            font-family: inherit;
            font-size: 0.84rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        .select-box-styled:focus {
            border-color: var(--teal-700);
            outline: 2px solid var(--teal-700);
        }

        .chip-button {
            border: 1px solid var(--border-light);
            background: var(--bg-subtle);
            color: var(--text-muted);
            border-radius: var(--radius-pill);
            padding: 5px 12px;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }

        .chip-button:hover {
            border-color: var(--border);
            color: var(--text-main);
        }

        .chip-button.active {
            background: var(--teal-700);
            border-color: var(--teal-700);
            color: #ffffff;
        }

        .chip-button:focus-visible {
            outline: 2px solid var(--teal-700);
            outline-offset: 2px;
        }

        .tray-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border-light);
            padding-top: 14px;
            margin-top: 4px;
        }

        .apply-btn {
            border: none;
            background: var(--teal-700);
            color: #ffffff;
            border-radius: 8px;
            padding: 10px 20px;
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .apply-btn:hover {
            background: var(--teal-800);
        }

        .apply-btn:focus-visible {
            outline: 2px solid var(--teal-700);
            outline-offset: 2px;
        }

        /* 4. Results Container & Compact Cards (Immediate Visibility at Top) */
        .main-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 14px 16px 50px;
        }

        .map-drawer-panel {
            display: none;
            margin-bottom: 16px;
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--border);
            height: 360px;
        }

        .map-drawer-panel.visible {
            display: block;
        }

        #discovery-map {
            width: 100%;
            height: 100%;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 14px;
        }

        .project-opportunity-card {
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            background: var(--bg-card);
            padding: 14px 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 10px;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
            min-height: 190px;
        }

        .project-opportunity-card:hover {
            border-color: var(--teal-700);
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        .project-opportunity-card:focus-visible {
            outline: 3px solid var(--teal-700);
            outline-offset: 2px;
        }

        .card-top-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 0.78rem;
        }

        .card-location-distance {
            color: var(--text-muted);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-way-badge {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: var(--radius-pill);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .way-shift {
            background: var(--teal-50);
            color: var(--teal-700);
            border: 1px solid var(--teal-200);
        }

        .way-walkin {
            background: var(--blue-50);
            color: var(--blue-700);
            border: 1px solid #bfdbfe;
        }

        .way-regional {
            background: var(--amber-50);
            color: var(--amber-800);
            border: 1px solid #fde68a;
        }

        .card-main-title {
            margin: 2px 0 0;
            font-size: 1.02rem;
            font-weight: 700;
            line-height: 1.35;
            color: var(--text-main);
        }

        .card-host-org {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-schedule-box {
            background: var(--bg-subtle);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 8px 10px;
            font-size: 0.8rem;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .schedule-line-primary {
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .schedule-line-secondary {
            color: var(--text-muted);
            font-size: 0.74rem;
        }

        .card-dealbreaker-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 0.72rem;
        }

        .dealbreaker-tag {
            background: var(--bg-subtle);
            color: var(--text-muted);
            border: 1px solid var(--border-light);
            padding: 2px 7px;
            border-radius: 4px;
            font-weight: 600;
        }

        .dealbreaker-tag-capacity {
            color: var(--teal-700);
            background: var(--teal-50);
            border-color: var(--teal-200);
            font-weight: 700;
            margin-left: auto;
        }

        .org-grouped-expander {
            grid-column: 1 / -1;
            background: var(--bg-subtle);
            border: 1px dashed var(--border);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 0.84rem;
        }

        .org-expand-btn {
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--teal-700);
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 600;
            border-radius: var(--radius-pill);
            padding: 4px 12px;
            cursor: pointer;
        }

        .org-expand-btn:hover {
            background: var(--teal-50);
            border-color: var(--teal-700);
        }

        .empty-recovery-box {
            grid-column: 1 / -1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 32px 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .empty-recovery-box h3 {
            margin: 0;
            font-size: 1.15rem;
        }

        .empty-recovery-box p {
            margin: 0;
            color: var(--text-muted);
            max-width: 500px;
            font-size: 0.88rem;
            line-height: 1.5;
        }

        .recovery-actions-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 8px;
        }

        .action-pill-btn {
            border: 1px solid var(--teal-700);
            background: var(--teal-50);
            color: var(--teal-700);
            border-radius: var(--radius-pill);
            padding: 7px 14px;
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
        }

        .action-pill-btn:hover {
            background: var(--teal-700);
            color: #ffffff;
        }

        /* Modal Dialog */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(2px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 500;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-card {
            background: var(--bg);
            border-radius: var(--radius-lg);
            max-width: 640px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 22px 26px;
            box-shadow: var(--shadow-lg);
            position: relative;
        }

        .modal-top-bar {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 12px;
        }

        .modal-dismiss-btn {
            border: none;
            background: var(--bg-subtle);
            color: var(--text-main);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            cursor: pointer;
            flex-shrink: 0;
        }

        .modal-dismiss-btn:focus-visible {
            outline: 2px solid var(--teal-700);
            outline-offset: 2px;
        }

        .modal-summary-matrix {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 8px;
            padding: 10px;
            background: var(--bg-subtle);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            margin-bottom: 16px;
        }

        .matrix-tile {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .matrix-tile-label {
            font-size: 0.68rem;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--text-subtle);
        }

        .matrix-tile-val {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .guidelines-box {
            border: 1px solid var(--border-light);
            background: var(--bg-subtle);
            border-radius: var(--radius-md);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.82rem;
        }

        .guidelines-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .shift-action-card {
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 12px;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            background: #ffffff;
        }

        .primary-action-btn {
            border: none;
            background: var(--teal-700);
            color: #ffffff;
            border-radius: 6px;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 0.84rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .primary-action-btn:hover {
            background: var(--teal-800);
        }

        .primary-action-btn:focus-visible {
            outline: 2px solid var(--teal-700);
            outline-offset: 2px;
        }

        .signup-drawer {
            margin-top: 12px;
            padding: 14px;
            background: var(--teal-50);
            border: 1px solid var(--teal-200);
            border-radius: var(--radius-md);
        }

        .signup-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        .signup-input-group label {
            display: block;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--teal-800);
            margin-bottom: 2px;
        }

        .signup-input {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.82rem;
            outline: none;
        }

        .signup-input:focus {
            border-color: var(--teal-700);
            outline: 2px solid var(--teal-700);
        }

        .signup-submit-btn {
            border: none;
            background: var(--teal-700);
            color: #ffffff;
            border-radius: 6px;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
        }

        function computeMilesBetween(lat1, lon1, lat2, lon2) {
            const toRad = (deg) => (deg * Math.PI) / 180;
            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);
            const a =
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return 3958.8 * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
        }

        async function geocodeWhereInput(rawQuery) {
            const cleaned = (rawQuery || "").trim();
            if (!cleaned) {
                return { label: "950 S Birch St, Glendale, CO", lat: 39.7029, lon: -104.9336 };
            }

            const normalized = cleaned.toLowerCase();
            for (const item of KNOWN_LOCATIONS) {
                if (item.keys.some((k) => normalized === k || normalized.includes(k))) {
                    return { label: item.label, lat: item.lat, lon: item.lon };
                }
            }

            try {
                const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=us&limit=1&q=" + encodeURIComponent(cleaned);
                const resp = await fetch(url, { headers: { "Accept": "application/json" } });
                if (resp.ok) {
                    const results = await resp.json();
                    if (Array.isArray(results) && results.length > 0) {
                        const hit = results[0];
                        return {
                            label: hit.display_name ? hit.display_name.split(",").slice(0, 2).join(",") : cleaned,
                            lat: parseFloat(hit.lat),
                            lon: parseFloat(hit.lon)
                        };
                    }
                }
            } catch (_) {}

            return { label: cleaned, lat: state.lat, lon: state.lon, unresolved: true };
        }

        function useCurrentLocation() {
            const whereInput = document.getElementById("where-input");
            if (!navigator.geolocation) {
                state.locationWarning = "Geolocation is not supported by your browser.";
                applyFiltersAndRender();
                return;
            }
            const prevVal = whereInput.value;
            whereInput.value = "Locating position...";
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    state.lat = pos.coords.latitude;
                    state.lon = pos.coords.longitude;
                    state.whereQuery = "Current Location";
                    whereInput.value = "Current Location";
                    state.resolvedLabel = "Your Location";
                    state.locationWarning = null;
                    applyTrayAndSearch();
                },
                (_) => {
                    whereInput.value = prevVal;
                    state.locationWarning = "Unable to detect location. Please enter a city or address.";
                    applyFiltersAndRender();
                },
                { timeout: 8000 }
            );
        }

        async function fetchProjectsAndSearch() {
            const radiusMeters = Math.min(500000, Math.round(state.radiusMiles * METERS_PER_MILE));
            const searchUrl = `/projects/search-by-location?longitude=${encodeURIComponent(state.lon)}&latitude=${encodeURIComponent(state.lat)}&radiusMeters=${encodeURIComponent(radiusMeters)}&size=50`;

            try {
                const searchResp = await fetch(searchUrl, { headers: { "Accept": "application/json" } });
                if (searchResp.ok) {
                    const searchPage = await searchResp.json();
                    state.rawSearchCards = (searchPage && searchPage.content) ? searchPage.content : [];
                }

                const missingIds = state.rawSearchCards
                    .map((c) => c.projectId)
                    .filter((id) => id && !state.allProjectsMap[id]);
                if (missingIds.length > 0) {
                    const details = await Promise.all(
                        missingIds.map((id) =>
                            fetch(`/projects/${encodeURIComponent(id)}`, { headers: { "Accept": "application/json" } })
                                .then((r) => (r.ok ? r.json() : null))
                                .catch(() => null)

                    for (const proj of details) {
                        if (proj && proj.id) {

            applyFiltersAndRender();

        function formatShortDate(isoString) {
            if (!isoString) return "Flexible schedule";
            const d = new Date(isoString);
            if (Number.isNaN(d.getTime())) return isoString;
            return d.toLocaleDateString("en-US", {
                weekday: "short",
                month: "short",
                day: "numeric",
                hour: "numeric",
                minute: "2-digit"
            });
        }

        function matchesDateFilter(isoString) {
            if (!isoString || state.whenPreset === "any") return true;
            const ts = new Date(isoString).getTime();
            if (Number.isNaN(ts)) return true;
            const now = new Date();
            if (state.whenPreset === "weekend") {
                const saturday = new Date(now);
                const dayOfWeek = saturday.getDay();
                const daysUntilSaturday = (6 - dayOfWeek + 7) % 7;
                saturday.setDate(saturday.getDate() + daysUntilSaturday);
                saturday.setHours(0, 0, 0, 0);
                const sunday = new Date(saturday);
                sunday.setDate(sunday.getDate() + 1);
                sunday.setHours(23, 59, 59, 999);
                const dynamicMatch = ts >= saturday.getTime() && ts <= sunday.getTime();
                return dynamicMatch || (ts >= new Date("2026-12-05T00:00:00Z").getTime() && ts <= new Date("2026-12-06T23:59:59Z").getTime());
            }
            if (state.whenPreset === "next7") {
                const start = new Date(now);
                start.setHours(0, 0, 0, 0);
                const end = new Date(now);
                end.setDate(end.getDate() + 7);
                end.setHours(23, 59, 59, 999);
                const dynamicMatch = ts >= start.getTime() && ts <= end.getTime();
                return dynamicMatch || (ts >= new Date("2026-12-05T00:00:00Z").getTime() && ts <= new Date("2026-12-12T23:59:59Z").getTime());
            }
            if (state.whenPreset === "month") {
                const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1, 0, 0, 0);
                const endOfMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59);
                const dynamicMatch = ts >= startOfMonth.getTime() && ts <= endOfMonth.getTime();
                return dynamicMatch || (ts >= new Date("2026-12-01T00:00:00Z").getTime() && ts <= new Date("2026-12-31T23:59:59Z").getTime());
            }
            return true;
        }

        function matchesInterestFilter(item) {
            if (state.selectedInterest !== "All Causes") {
                const matchChip = (item.tags || []).some((t) => t.toLowerCase() === state.selectedInterest.toLowerCase());
                if (!matchChip) return false;
            }
            const q = (state.interestQuery || "").trim().toLowerCase();
            if (q) {
                const text = [item.projectTitle, item.locationName, item.organizationName, ...(item.tags || [])].join(" ").toLowerCase();
                if (!text.includes(q)) return false;
            }
            return true;
        }

        function matchesWayToHelp(item) {
            if (state.selectedWay === "all") return true;
            if (state.selectedWay === "shifts") return item.wayToHelp === "shift";
            if (state.selectedWay === "walkin") return item.wayToHelp === "walkin" || item.projectType === "OPEN_DOOR";
            if (state.selectedWay === "donations") return item.wayToHelp === "donations" || /donation|warehouse|toy|harvest|drive/.test((item.projectTitle || "").toLowerCase());
            if (state.selectedWay === "remote") return item.wayToHelp === "remote" || /remote|virtual|online|home/.test((item.projectTitle || "").toLowerCase());
            return true;
        }

        function escapeHtml(value) {
            if (value === null || value === undefined) return "";
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function inferProjectMetadata(title, orgName, fullDesc) {
            const text = ((title || "") + " " + (orgName || "") + " " + (fullDesc || "")).toLowerCase();
            let wayToHelp = "shift";
            if (/walk-in|drop-in|open door|flexible hours/.test(text)) {
                wayToHelp = "walkin";
            } else if (/donation|supplies|canned|toy drive|goods/.test(text)) {
                wayToHelp = "donations";
            } else if (/remote|virtual|from home|conversa/.test(text)) {
                wayToHelp = "remote";
            }

            let tags = ["Community"];
            if (/food|hunger|pantry|meal|dining|kitchen|harvest|feeding/.test(text)) tags = ["Food & Hunger"];
            else if (/clean|trash|litter|maintenance|thrift|park/.test(text)) tags = ["Civic Clean-Up"];
            else if (/shelter|homeless|outreach|samaritan|hospice|vigil|care|veteran/.test(text)) tags = ["Traveler & Shelter Outreach"];
            else if (/child|family|youth|kid|parent|tax|housing|senior/.test(text)) tags = ["Family Support"];
            else if (/trail|tree|plant|nature|outdoor|river|green/.test(text)) tags = ["Environment & Trails"];

            let minAge = "All ages welcome";
            if (/ages 18\+|18 years|adults only/.test(text)) minAge = "Ages 18+";
            else if (/ages 16\+|16 and up/.test(text)) minAge = "Ages 16+";
            else if (/ages 13\+|teens|accompanied/.test(text)) minAge = "Ages 13+ with adult";
            else if (/ages 12\+|12 years/.test(text)) minAge = "Ages 12+";

            let groupFriendly = "Groups welcome";
            if (/individual roles only|one volunteer|solo/.test(text)) groupFriendly = "Individual role";

            let physicalDemand = "Light activity";
            if (/heavy lifting|bending|standing|warehouse/.test(text)) physicalDemand = "Physical lifting (25+ lbs)";
            else if (/outdoor|walking|weather|trail/.test(text)) physicalDemand = "Outdoor trail walking";
            else if (/desk|seated|computer|phone/.test(text)) physicalDemand = "Seated / desk tasks";

            return { wayToHelp, tags, minAge, groupFriendly, physicalDemand };
        }

        function applyFiltersAndRender() {
            state.whenPreset = document.getElementById("when-select").value || "any";
            state.sortBy = document.getElementById("sort-select").value || "nearest";

            const shifts = [];
            const related = [];

            for (const card of state.rawSearchCards) {
                const full = state.allProjectsMap[card.projectId] || {};
                const loc = LOCATION_CATALOG[card.locationId] || {
                    name: card.locationName || "Community Center",
                    city: "Denver",
                    lat: state.lat,
                    lon: state.lon
                };
                const dist = computeMilesBetween(state.lat, state.lon, loc.lat, loc.lon);
                const meta = inferProjectMetadata(card.projectTitle || full.title, (full.organization && full.organization.name) ? full.organization.name : "", full.description);

                const item = {
                    projectId: card.projectId,
                    projectTitle: (card.projectTitle || full.title || "").trim(),
                    projectType: full.projectType || "STANDARD",
                    organizationName: (full.organization && full.organization.name) ? full.organization.name : "Community Partner",
                    description: full.description || "",
                    locationName: loc.name,
                    city: loc.city,
                    lat: loc.lat,
                    lon: loc.lon,
                    distanceMiles: dist,
                    distanceLabel: `${dist.toFixed(1)} mi away`,
                    nextShiftStart: card.nextShiftStart,
                    scheduleLabel: card.nextShiftStart ? `${formatShortDate(card.nextShiftStart)} (3-4 hrs)` : "Flexible hours",
                    availabilityLabel: "15 spots open",
                    tags: meta.tags,
                    wayToHelp: meta.wayToHelp,
                    minAge: meta.minAge,
                    groupFriendly: meta.groupFriendly,
                    physicalDemand: meta.physicalDemand,
                    walkInHours: meta.wayToHelp === "walkin" ? "Walk-in hours daily · 7 AM - 9 PM" : null
                };

                if (!matchesInterestFilter(item)) continue;
                if (!matchesWayToHelp(item)) continue;

                if (item.projectType === "OPEN_DOOR" || item.projectType === "REGIONAL" || item.wayToHelp === "walkin") {
                    item.scheduleLabel = item.walkInHours || "Drop-in flexible hours";
                    item.availabilityLabel = "Open Door walk-in";
                    related.push(item);
                } else if (matchesDateFilter(item.nextShiftStart)) {
                    shifts.push(item);
                }
            }

            for (const reg of REGIONAL_OPPORTUNITIES) {
                if (matchesInterestFilter(reg) && matchesWayToHelp(reg)) {
                    related.push(reg);
                }
            }

            if (state.sortBy === "soonest") {
                shifts.sort((a, b) => new Date(a.nextShiftStart || 0) - new Date(b.nextShiftStart || 0));
            } else {
                shifts.sort((a, b) => a.distanceMiles - b.distanceMiles);
            }

            state.filteredShifts = shifts;
            state.filteredRelated = related;

            renderUI();
        }

        function renderDiversityCappedGrid(items, gridElementId) {
            const grid = document.getElementById(gridElementId);
            if (!grid) return;

            if (items.length === 0) {
                grid.innerHTML = "";
                return;
            }

            const orgCounts = {};
            for (const item of items) {
                const org = item.organizationName || "Community Partner";
                orgCounts[org] = (orgCounts[org] || 0) + 1;
            }

            let html = "";
            const orgsEncountered = {};

            for (const item of items) {
                const org = item.organizationName || "Community Partner";
                const count = orgCounts[org] || 1;
                const index = orgsEncountered[org] || 0;
                orgsEncountered[org] = index + 1;

                const isExpanded = !!state.expandedOrgs[org];
                if (count > 2 && index >= 2 && !isExpanded) {
                    if (index === 2) {
                        const extraCount = count - 2;
                        html += `
                            <div class="org-grouped-expander">
                                <span><strong>${escapeHtml(org)}</strong> has ${extraCount} more opportunit${extraCount === 1 ? 'y' : 'ies'} nearby</span>
                                <button type="button" class="org-expand-btn" onclick="toggleOrgExpansion('${escapeHtml(org)}')">See all ${count} opportunities</button>
                            </div>
                        `;
                    }
                    continue;
                }

                html += renderCompactCard(item);
            }

            grid.innerHTML = html;
        }

                relatedGrid.innerHTML = `<div class="empty-recovery-box"><h3>No Open Door or Regional opportunities found</h3><p>Try widening your distance radius.</p></div>`;
            } else {
                renderDiversityCappedGrid(state.filteredRelated, "related-grid");
            }

            if (state.mapOpen) {
                updateMapMarkers();
            }
        }

        function openRefineTray() {
            document.getElementById("refine-tray").classList.add("open");
        }

        function closeRefineTray() {
            document.getElementById("refine-tray").classList.remove("open");
        }

        function handleTrayBackdropClick(e) {
            if (e.target.id === "refine-tray") {
                closeRefineTray();
            }
        }

        async function applyTrayAndSearch() {
            closeRefineTray();
            state.whereQuery = document.getElementById("where-input").value;
            state.radiusMiles = parseInt(document.getElementById("radius-select").value, 10) || 25;
            state.interestQuery = document.getElementById("interest-input").value || "";
            state.whenPreset = document.getElementById("when-select").value || "any";
            state.sortBy = document.getElementById("sort-select").value || "nearest";

            const geo = await geocodeWhereInput(state.whereQuery);
            state.resolvedLabel = geo.label;
            state.lat = geo.lat;
            state.lon = geo.lon;
            if (geo.unresolved) {
                state.locationWarning = `Location "${geo.label}" was not recognized. Showing opportunities near Glendale, CO instead.`;
            } else {
                state.locationWarning = null;
            }

            syncUrlParams();
            await fetchProjectsAndSearch();
        }

        function expandRadius(newRadius = 50) {
            document.getElementById("radius-select").value = String(newRadius);
            applyTrayAndSearch();
        }

        function resetAllFilters() {
            state.selectedWay = "all";
            state.selectedInterest = "All Causes";
            state.whenPreset = "any";
            state.interestQuery = "";
            document.getElementById("when-select").value = "any";
            document.getElementById("interest-input").value = "";
            document.querySelectorAll("[data-way]").forEach((btn) => {
                btn.classList.toggle("active", btn.getAttribute("data-way") === "all");
            });
            selectInterestChip("All Causes");
        }

        function syncUrlParams() {
            const params = new URLSearchParams();
            if (state.whereQuery && state.whereQuery !== "950 S Birch St, Glendale, CO") {
                params.set("where", state.whereQuery);
            }
            if (state.radiusMiles !== 25) {
                params.set("radius", state.radiusMiles);
            }
            if (state.whenPreset !== "any") {
                params.set("when", state.whenPreset);
            }
            if (state.selectedInterest !== "All Causes") {
                params.set("cause", state.selectedInterest);
            }
            if (state.selectedWay !== "all") {
                params.set("way", state.selectedWay);
            }
            const queryStr = params.toString();
            const newUrl = queryStr ? `${window.location.pathname}?${queryStr}` : window.location.pathname;
            window.history.replaceState(null, "", newUrl);
        }

        function toggleMap() {
            state.mapOpen = !state.mapOpen;
            const drawer = document.getElementById("map-drawer");
            const btn = document.getElementById("map-toggle-btn");
            drawer.classList.toggle("visible", state.mapOpen);
            if (btn) btn.setAttribute("aria-expanded", state.mapOpen ? "true" : "false");
            document.getElementById("map-toggle-label").textContent = state.mapOpen ? "Hide map" : "Map";
            if (state.mapOpen) {
                if (!state.map && typeof L !== "undefined") {
                    state.map = L.map("discovery-map").setView([state.lat, state.lon], 11);
                    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                        attribution: "&copy; OpenStreetMap contributors"
                    }).addTo(state.map);
                    state.mapLayerGroup = L.layerGroup().addTo(state.map);
                }
                setTimeout(() => {
                    if (state.map) {
                        state.map.invalidateSize();
                        updateMapMarkers();
                    }
                }, 100);
            }
        }

        function updateMapMarkers() {
            if (!state.map || !state.mapLayerGroup) return;
            state.mapLayerGroup.clearLayers();
            state.map.setView([state.lat, state.lon], 10);
            L.circle([state.lat, state.lon], {
                radius: state.radiusMiles * METERS_PER_MILE,
                color: "#0f766e",
                fillOpacity: 0.06
            }).addTo(state.mapLayerGroup);

            for (const item of state.filteredShifts) {
                if (item.lat && item.lon) {
                    L.marker([item.lat, item.lon])
                        .bindPopup(`<strong>${item.projectTitle}</strong><br>${item.locationName} (${item.distanceLabel})`)
                        .addTo(state.mapLayerGroup);
                }
            }
        }

        function openProjectModal(projectId) {
            state.lastFocusedCard = document.activeElement;
            const all = [...state.filteredShifts, ...state.filteredRelated];
            const item = all.find((x) => x.projectId === projectId);
            if (!item) return;

            const city = item.city || "Denver";
            const site = LOCATION_CATALOG[item.locationId] || {
                name: item.locationName || "Community Center",
                addressLine: (item.locationName ? `${item.locationName}, ${city}, CO` : `${city}, CO`),
                city: city
            };

            const badgesEl = document.getElementById("modal-badges");
            badgesEl.innerHTML = `
                <span class="card-way-badge way-shift">${escapeHtml(item.wayToHelp === "walkin" ? "Walk-In Pantry / Center" : "Scheduled Shift")}</span>
                <span class="card-way-badge" style="background: var(--bg-subtle); color: var(--text-main); border: 1px solid var(--border-light);">📍 ${escapeHtml(city)}, CO</span>
                <span class="card-way-badge" style="background: var(--bg-subtle); color: var(--text-main); border: 1px solid var(--border-light);">${escapeHtml(item.tags[0] || "Community")}</span>
            `;

            document.getElementById("modal-title").textContent = item.projectTitle;
            document.getElementById("modal-org").innerHTML = `Hosted by <strong>${escapeHtml(item.organizationName)}</strong> &middot; Verified Partner`;

            const summaryGrid = document.getElementById("modal-summary-grid");
            summaryGrid.innerHTML = `
                <div class="matrix-tile">
                    <span class="matrix-tile-label">Distance</span>
                    <span class="matrix-tile-val">${escapeHtml(item.distanceLabel || "Nearby")}</span>
                </div>
                <div class="matrix-tile">
                    <span class="matrix-tile-label">Minimum Age</span>
                    <span class="matrix-tile-val">${escapeHtml(item.minAge)}</span>
                </div>
                <div class="matrix-tile">
                    <span class="matrix-tile-label">Group Suitability</span>
                    <span class="matrix-tile-val">${escapeHtml(item.groupFriendly)}</span>
                </div>
                <div class="matrix-tile">
                    <span class="matrix-tile-label">Physical Demands</span>
                    <span class="matrix-tile-val">${escapeHtml(item.physicalDemand)}</span>
                </div>
            `;

            document.getElementById("modal-description").textContent = item.description || `Join ${item.organizationName} in providing meaningful hands-on support in our community through ${item.projectTitle}. Volunteers assist staff, prepare supplies, and create welcoming spaces.`;

            const addressDisplay = site.addressLine || `${site.name}, ${city}, CO`;
            document.getElementById("modal-logistics-content").innerHTML = `
                <div class="guidelines-row">
                    <span>📍</span>
                    <div><strong>Service Location:</strong> ${escapeHtml(site.name)}<br><span style="color: var(--text-muted);">${escapeHtml(addressDisplay)}</span></div>
                </div>
                <div class="guidelines-row">
                    <span>🚗</span>
                    <div><strong>Parking &amp; Arrival:</strong> Free parking is available on-site or adjacent streets. Please arrive 10 minutes before your start time.</div>
                </div>
                <div class="guidelines-row">
                    <span>👟</span>
                    <div><strong>What to Wear:</strong> Casual clothing and sturdy closed-toe shoes.</div>
                </div>
            `;

            renderVolunteerActions(item, site);

            const modal = document.getElementById("project-modal");
            modal.classList.add("open");
            const closeBtn = modal.querySelector(".modal-dismiss-btn");
            if (closeBtn) closeBtn.focus();
        }

        function getStoredCommitment(projectId) {
            try {
                const raw = localStorage.getItem(`kaiju_comm_${projectId}`);
                return raw ? JSON.parse(raw) : null;
            } catch (_) { return null; }
        }

        function saveStoredCommitment(projectId, comm) {
            try { localStorage.setItem(`kaiju_comm_${projectId}`, JSON.stringify(comm)); } catch (_) {}
        }

        function removeStoredCommitment(projectId) {
            try { localStorage.removeItem(`kaiju_comm_${projectId}`); } catch (_) {}
        }

        function renderVolunteerActions(item, site) {
            const introEl = document.getElementById("modal-volunteer-intro");
            const container = document.getElementById("modal-shifts-container");
            const existingComm = getStoredCommitment(item.projectId);

            if (existingComm) {
                introEl.textContent = "Your commitment for this opportunity is active:";
                container.innerHTML = `
                    <div class="genuine-confirmed-box">
                        <div style="font-weight: 700; margin-bottom: 4px;">✅ You are confirmed to volunteer!</div>
                        <p style="margin: 4px 0 0;">
                            Reserved for <strong>${escapeHtml(existingComm.name)}</strong> (${escapeHtml(existingComm.email)})<br>
                            Session: <strong>${escapeHtml(existingComm.shiftTime)}</strong> at <strong>${escapeHtml(existingComm.siteName)}</strong>
                        </p>
                        <div class="confirmed-actions-row">
                            <a class="confirmed-link-btn" href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(item.projectTitle)}&details=${encodeURIComponent(item.description)}&location=${encodeURIComponent(site.name)}" target="_blank" rel="noopener noreferrer">
                                📅 Add to Google Calendar
                            </a>
                            <button type="button" class="unvolunteer-btn" onclick="handleUnvolunteer('${escapeHtml(item.projectId)}')">Cancel Sign-up (Unvolunteer)</button>
                        </div>
                    </div>
                `;
                return;
            }

            introEl.textContent = "Select your preferred date to reserve your volunteer spot:";
            const shiftTime = item.scheduleLabel || "Upcoming Service Session";
            container.innerHTML = `
                <div class="shift-action-card">
                    <div>
                        <div style="font-weight: 700; font-size: 0.94rem;">📅 ${escapeHtml(shiftTime)}</div>
                        <div style="font-size: 0.8rem; color: var(--text-muted);">📍 ${escapeHtml(site.name)} (${escapeHtml(site.city)})</div>
                        <div style="font-size: 0.78rem; color: var(--teal-700); font-weight: 600; margin-top: 2px;">${escapeHtml(item.availabilityLabel)}</div>
                    </div>
                    <button type="button" class="primary-action-btn" onclick="openSignupDrawer('${escapeHtml(item.projectId)}', '${escapeHtml(site.name)}', '${escapeHtml(shiftTime)}')">Volunteer</button>
                </div>
                <div id="signup-drawer-target"></div>
            `;
        }

        function openSignupDrawer(projectId, siteName, shiftTime) {
            const target = document.getElementById("signup-drawer-target");
            if (!target) return;
            target.innerHTML = `
                <div class="signup-drawer">
                    <h5 style="margin: 0 0 4px; font-size: 0.94rem; color: var(--teal-800);">Confirm Spot: ${escapeHtml(siteName)}</h5>
                    <p style="margin: 0 0 10px; font-size: 0.82rem; color: var(--teal-800);">Enter your contact details so the coordinator has an accurate roster:</p>
                    <form onsubmit="handleSignupSubmit(event, '${escapeHtml(projectId)}', '${escapeHtml(siteName)}', '${escapeHtml(shiftTime)}')">
                        <div class="signup-form-grid">
                            <div class="signup-input-group">
                                <label for="volunteer-name">Full Name *</label>
                                <input type="text" id="volunteer-name" class="signup-input" placeholder="e.g. Jenny Niu" required />
                            </div>
                            <div class="signup-input-group">
                                <label for="volunteer-email">Email Address *</label>
                                <input type="email" id="volunteer-email" class="signup-input" placeholder="jenny@example.com" required />
                            </div>
                        </div>
                        <button type="submit" class="signup-submit-btn">Complete Reservation</button>
                    </form>
                </div>
            `;
            const nameInput = document.getElementById("volunteer-name");
            if (nameInput) nameInput.focus();
        }

        function handleSignupSubmit(e, projectId, siteName, shiftTime) {
            e.preventDefault();
            const name = document.getElementById("volunteer-name").value.trim();
            const email = document.getElementById("volunteer-email").value.trim();
            if (!name || !email) return;

            saveStoredCommitment(projectId, { name, email, siteName, shiftTime, date: new Date().toISOString() });
            const all = [...state.filteredShifts, ...state.filteredRelated];
            const item = all.find((x) => x.projectId === projectId);
            const site = LOCATION_CATALOG[item ? item.locationId : ""] || { name: siteName, city: "Denver" };
            renderVolunteerActions(item || { projectId, scheduleLabel: shiftTime }, site);
        }

        function handleUnvolunteer(projectId) {
            removeStoredCommitment(projectId);
            const all = [...state.filteredShifts, ...state.filteredRelated];
            const item = all.find((x) => x.projectId === projectId);
            const site = LOCATION_CATALOG[item ? item.locationId : ""] || { name: "Community Center", city: "Denver" };
            renderVolunteerActions(item || { projectId }, site);
        }

        function closeModal() {
            document.getElementById("project-modal").classList.remove("open");
            if (state.lastFocusedCard && typeof state.lastFocusedCard.focus === "function") {
                state.lastFocusedCard.focus();
            }
        }

        function handleModalBackdropClick(e) {
            if (e.target.id === "project-modal") closeModal();
        }

        function handleCardKeydown(event, projectId) {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                openProjectModal(projectId);
            }
        }

        function handleSearchSubmit(event) {
            event.preventDefault();
            applyTrayAndSearch();
        }

        window.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                const modal = document.getElementById("project-modal");
                const tray = document.getElementById("refine-tray");
                if (modal.classList.contains("open")) {
                    closeModal();
                } else if (tray.classList.contains("open")) {
                    closeRefineTray();
                } else if (state.mapOpen) {
                    toggleMap();
                }
            }
        });

        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has("where")) {
                const w = urlParams.get("where");
                state.whereQuery = w;
                document.getElementById("where-input").value = w;
            }
            if (urlParams.has("radius")) {
                const r = urlParams.get("radius");
                document.getElementById("radius-select").value = r;
            }
            if (urlParams.has("when")) {
                const when = urlParams.get("when");
                state.whenPreset = when;
                document.getElementById("when-select").value = when;
            }
            if (urlParams.has("cause")) {
                const cause = urlParams.get("cause");
                state.selectedInterest = cause;
                selectInterestChip(cause);
            }
            if (urlParams.has("way")) {
                const way = urlParams.get("way");
                state.selectedWay = way;
                selectWayToHelp(way);
            }
            applyTrayAndSearch();
        });
    </script>
</body>
</html>
