micronaut:
  application:
    name: kaiju
  server:
    thread-selection: AUTO
  executors:
    io:
      type: THREAD_PER_TASK
      virtual: true
    blocking:
      type: THREAD_PER_TASK
      virtual: true
    scheduled:
      type: SCHEDULED
      virtual: true
  metrics:
    enabled: true
  security:
    authentication: cookie
    endpoints:
      logout:
        get-allowed: true
    token:
      jwt:
        enabled: true
        nimbus:
          reactive-validator-execute-on-blocking: true
        claims-validators:
          issuer: ${OAUTH_ISSUER:`http://localhost:9000/application/o/kaiju/`}
          audience: ${OAUTH_CLIENT_ID:kaiju-client}
        signatures:
          jwks:
            authentik:
              url: ${OAUTH_JWKS_URL:http://localhost:9000/application/o/kaiju/jwks/}
    oauth2:
      clients:
        authentik:
          client-id: ${OAUTH_CLIENT_ID:kaiju-client}
          client-secret: ${OAUTH_CLIENT_SECRET:kaiju-secret}
          openid:
            issuer: ${OAUTH_ISSUER:http://localhost:9000/application/o/kaiju/}
datasources:
  default:
    url: jdbc:postgresql://localhost:5432/volunteer_monster
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    db-type: postgres
    schema-generate: NONE
    dialect: POSTGRES
flyway:
  datasources:
    default:
      enabled: true
      locations:
        - filesystem:database/init
      sql-migration-prefix: ""
      sql-migration-separator: "-"
micrometer:
  observation:
    http:
      server:
        enabled: true
      client:
        enabled: true
