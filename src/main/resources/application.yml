micronaut:
  application:
    name: kaiju
  metrics:
    enabled: true
  security:
    authentication: cookie
    endpoints:
      logout:
        get-allowed: true
    token:
      jwt:
        signatures:
          secret:
            generator:
              secret: ${JWT_GENERATOR_SIGNATURE_SECRET:pleaseChangeThisSecretForANewOne}
    oauth2:
      clients:
        authentik:
          client-id: ${OAUTH_CLIENT_ID:kaiju-client}
          client-secret: ${OAUTH_CLIENT_SECRET:kaiju-secret}
          openid:
            issuer: ${OAUTH_ISSUER:http://localhost:9000/application/o/kaiju/}
datasources:
  default:
    url: jdbc:postgresql://localhost:5432/volunteer_monster
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    db-type: postgres
    schema-generate: NONE
    dialect: POSTGRES
flyway:
  datasources:
    default:
      enabled: true
      locations:
        - filesystem:database/init
      sql-migration-prefix: ""
      sql-migration-separator: "-"
test-resources:
  containers:
    postgres:
      image-name: postgis/postgis:15-3.5
      db-name: volunteer_monster
      username: jimmy
      password: warm-farts-smell-worse
    postgis:
      image-name: postgis/postgis:15-3.5
      db-name: volunteer_monster
      username: jimmy
      password: warm-farts-smell-worse
micrometer:
  observation:
    http:
      server:
        enabled: true
      client:
        enabled: true
