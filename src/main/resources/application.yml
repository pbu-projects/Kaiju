micronaut:
  application:
    name: kaiju
  views:
    jte:
      enabled: true
  router:
    static-resources:
      default:
        enabled: true
        mapping: /**
        paths: classpath:public
  server:
    thread-selection: AUTO
  executors:
    io:
      type: THREAD_PER_TASK
      virtual: true
    blocking:
      type: THREAD_PER_TASK
      virtual: true
    scheduled:
      type: SCHEDULED
      virtual: true
  metrics:
    enabled: true
  security:
    authentication: idtoken
    intercept-url-map:
      - pattern: /css/**
        access:
          - isAnonymous()
      - pattern: /views/**
        access:
          - isAnonymous()
    endpoints:
      logout:
        get-allowed: false
    token:
      jwt:
        enabled: true
        nimbus:
          reactive-validator-execute-on-blocking: true
        claims-validators:
          issuer: ${OAUTH_ISSUER:`http://localhost:9000/application/o/kaiju/`}
          audience: ${OAUTH_CLIENT_ID:kaiju-client}
    oauth2:
      clients:
        authentik:
          client-id: ${OAUTH_CLIENT_ID:kaiju-client}
          client-secret: ${OAUTH_CLIENT_SECRET}
          openid:
            issuer: ${OAUTH_ISSUER}
endpoints:
  all:
    sensitive: true
  health:
    sensitive: false
    details-visible: AUTHENTICATED
datasources:
  default:
    url: jdbc:postgresql://localhost:5432/volunteer_monster
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    db-type: postgres
    schema-generate: NONE
    dialect: POSTGRES
flyway:
  datasources:
    default:
      enabled: true
      locations:
        - classpath:db/migration
      sql-migration-prefix: ""
      sql-migration-separator: "-"
micrometer:
  observation:
    http:
      server:
        enabled: true
      client:
        enabled: true
