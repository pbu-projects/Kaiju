components:
  schemas:
    AdministrativeRegion:
      required:
      - geom
      - id
      - name
      type: object
      properties:
        geom:
          $ref: "#/components/schemas/Geometry"
        id:
          type: string
          format: uuid
        name:
          maxLength: 255
          minLength: 1
          type: string
          x-size-message: Administrative region name must be between 1 and 255 characters.
        parentRegionId:
          type: string
          format: uuid
          nullable: true
    AuditAction:
      type: string
      enum:
      - CREATED
      - APPROVED
      - REJECTED
      - EDITED
    Boundary:
      required:
      - geom
      - id
      - name
      type: object
      properties:
        geom:
          $ref: "#/components/schemas/Geometry"
        id:
          type: string
          format: uuid
        name:
          maxLength: 255
          minLength: 1
          type: string
          x-size-message: Boundary name must be between 1 and 255 characters.
    Coordinate:
      required:
      - x
      - "y"
      - z
      type: object
      properties:
        coordinate:
          $ref: "#/components/schemas/Coordinate"
        x:
          type: number
          format: double
        "y":
          type: number
          format: double
        z:
          type: number
          format: double
        m:
          type: number
          format: double
        valid:
          type: boolean
    CoordinateDto:
      required:
      - latitude
      - longitude
      type: object
      properties:
        longitude:
          maximum: 180
          minimum: -180
          type: number
          format: double
          x-maximum-message: Longitude must be less than or equal to 180.
          x-minimum-message: Longitude must be greater than or equal to -180.
          x-not-null-message: Longitude is required.
        latitude:
          maximum: 90
          minimum: -90
          type: number
          format: double
          x-maximum-message: Latitude must be less than or equal to 90.
          x-minimum-message: Latitude must be greater than or equal to -90.
          x-not-null-message: Latitude is required.
    CoordinateSequence:
      type: object
      properties:
        dimension:
          type: integer
          format: int32
        measures:
          type: integer
          format: int32
    CoordinateSequenceFactory:
      type: object
    CreateAdministrativeRegionCommand:
      required:
      - coordinates
      - name
      type: object
      properties:
        name:
          maxLength: 255
          minLength: 1
          type: string
          x-size-message: Administrative region name must be between 1 and 255 characters.
        parentRegionId:
          type: string
          format: uuid
          nullable: true
        coordinates:
          minItems: 3
          type: array
          items:
            $ref: "#/components/schemas/CoordinateDto"
          x-size-message: A region polygon must contain at least 3 coordinates.
          x-not-null-message: Region coordinates are required.
    CreateBoundaryCommand:
      required:
      - coordinates
      - name
      type: object
      properties:
        name:
          maxLength: 255
          minLength: 1
          type: string
          x-size-message: Boundary name must be between 1 and 255 characters.
        coordinates:
          minItems: 3
          type: array
          items:
            $ref: "#/components/schemas/CoordinateDto"
          x-size-message: A polygon boundary must contain at least 3 coordinates.
          x-not-null-message: Boundary coordinates are required.
    CreateLocationCommand:
      required:
      - addressLine
      - city
      - countryCode
      - latitude
      - longitude
      - name
      type: object
      properties:
        name:
          maxLength: 255
          minLength: 1
          type: string
          x-size-message: Location name must be between 1 and 255 characters.
        addressLine:
          maxLength: 255
          minLength: 1
          type: string
          x-size-message: Location address line must be between 1 and 255 characters.
        city:
          maxLength: 100
          minLength: 1
          type: string
          x-size-message: Location city must be between 1 and 100 characters.
        stateProvince:
          maxLength: 100
          minLength: 1
          type: string
          nullable: true
          x-size-message: Location state/province must be between 1 and 100 characters.
        postalCode:
          maxLength: 20
          minLength: 1
          type: string
          nullable: true
          x-size-message: Location postal code must be between 1 and 20 characters.
        countryCode:
          maxLength: 2
          minLength: 2
          type: string
          x-size-message: Location country code must be 2 characters.
        longitude:
          maximum: 180
          minimum: -180
          type: number
          format: double
          x-maximum-message: Longitude must be less than or equal to 180.
          x-minimum-message: Longitude must be greater than or equal to -180.
          x-not-null-message: Longitude is required.
        latitude:
          maximum: 90
          minimum: -90
          type: number
          format: double
          x-maximum-message: Latitude must be less than or equal to 90.
          x-minimum-message: Latitude must be greater than or equal to -90.
          x-not-null-message: Latitude is required.
        timezone:
          maxLength: 100
          minLength: 1
          type: string
          nullable: true
          x-size-message: Location timezone must be between 1 and 100 characters.
    CreateOrganizationCommand:
      required:
      - isPublic
      - name
      type: object
      properties:
        name:
          maxLength: 255
          minLength: 1
          type: string
          x-size-message: Organization name must be between 1 and 255 characters.
        websiteUrl:
          maxLength: 255
          minLength: 1
          type: string
          nullable: true
          x-size-message: Organization website URL must be between 1 and 255 characters.
        parentId:
          type: string
          format: uuid
          nullable: true
        isPublic:
          type: boolean
          x-not-null-message: isPublic is required.
    CreateOrganizationUserCommand:
      required:
      - organizationId
      - role
      - userId
      type: object
      properties:
        userId:
          type: string
          format: uuid
          x-not-null-message: User ID is required.
        organizationId:
          type: string
          format: uuid
          x-not-null-message: Organization ID is required.
        role:
          $ref: "#/components/schemas/OrganizationUserRole"
    CreateProjectCommand:
      required:
      - boundaries
      - description
      - organizationId
      - projectType
      - title
      type: object
      properties:
        organizationId:
          type: string
          format: uuid
          x-not-null-message: Project organization ID is required.
        managingRegionId:
          type: string
          format: uuid
          nullable: true
        title:
          maxLength: 255
          minLength: 1
          type: string
          x-size-message: Project title must be between 1 and 255 characters.
        description:
          maxLength: 4000
          minLength: 20
          type: string
          x-size-message: Project description must be between 20 and 4000 characters.
        projectType:
          $ref: "#/components/schemas/ProjectType"
        status:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/ProjectStatus"
        locations:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ProjectLocationCommand"
        boundaries:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/ProjectBoundaryCommand"
          x-size-message: Project boundaries must not be empty.
          x-not-null-message: Project boundaries are required.
    CreateRegionUserCommand:
      required:
      - regionId
      - role
      - userId
      type: object
      properties:
        userId:
          type: string
          format: uuid
          x-not-null-message: User ID is required.
        regionId:
