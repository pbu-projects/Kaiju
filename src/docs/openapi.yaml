          x-not-null-message: Shift start time is required.
        endTime:
          type: string
          format: date-time
          x-not-null-message: Shift end time is required.
        tagIds:
          type: array
          nullable: true
          items:
            type: string
            format: uuid
    CreateTagCommand:
