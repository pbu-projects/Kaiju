              schema:
                $ref: "#/components/schemas/Project"
  /projects/search-by-location:
    get:
      summary: Searches active projects by their closest location coordinates within
        a given radius.
      description: "Searches active projects by their closest location coordinates\
        \ within a given radius. Each project is returned only once, representing\
        \ its closest location within range."
      operationId: searchByLocation_1
      parameters:
      - name: longitude
        in: query
        description: the longitude of the center point
        required: true
        explode: false
        schema:
          maximum: 180
          minimum: -180
          type: number
          format: double
      - name: latitude
        in: query
        description: the latitude of the center point
        required: true
        explode: false
        schema:
          maximum: 90
          minimum: -90
          type: number
          format: double
      - name: radiusMeters
        in: query
        description: the search radius in meters
        required: true
        explode: false
        schema:
          maximum: 500000
          minimum: 0
          exclusiveMinimum: true
          type: number
          format: double
      - name: pageable
        in: query
        description: pagination information
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: a page of project search cards sorted by distance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page_ProjectSearchCard_"
  /projects/{id}:
    get:
      operationId: getProject
      parameters:
      - name: id
        in: path
        required: true
