openapi: 3.0.1
info:
  title: Kaiju Civic Engine API
  description: High-performance spatial volunteer management and civic engagement
    engine
  contact:
    name: Peanut Butter Unicorn
    url: https://kaiju.pbu.lol
  version: 0.0.5
servers:
- url: /
  description: Current Server
security:
- bearerAuth: []
paths:
  /admin/users/{id}/role:
    put:
      summary: Explicit endpoint for role elevation.
      description: Explicit endpoint for role elevation. Prevents Mass Assignment
        by only accepting a RoleUpdateRequest.
      operationId: updateUserRole
      parameters:
      - name: id
        in: path
        description: the ID of the user to promote/demote
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: the requested role
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleUpdateRequest"
        required: true
      responses:
        "200":
          description: the updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /administrative-regions:
    get:
      summary: Retrieves a paginated list of administrative regions using cursor-based
        pagination.
      description: Retrieves a paginated list of administrative regions using cursor-based
        pagination. Accessible to all authenticated platform roles.
      operationId: getAdministrativeRegions
      parameters:
      - name: pageable
        in: query
        description: "cursor pagination parameters (cursor, limit, sort)"
        explode: false
        schema:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/CursoredPageable"
      responses:
        "200":
          description: a CursoredPage containing administrative region entities and
            next cursor details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursoredPage_AdministrativeRegion_"
    post:
      summary: Creates and persists a new administrative region polygon.
      description: Creates and persists a new administrative region polygon. Restricted
        to platform administrators (`GLOBAL_ADMIN`) and regional managers (`REGIONAL_ADMIN`).
      operationId: addAdministrativeRegion
      requestBody:
        description: "the administrative region creation command, including its geographic\
          \ boundary coordinates"
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdministrativeRegionCommand"
        required: true
      responses:
        "200":
          description: the persisted AdministrativeRegion with its assigned identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdministrativeRegion"
  /administrative-regions/{id}:
    get:
      summary: Retrieves an administrative region by its unique identifier.
      description: Retrieves an administrative region by its unique identifier. Accessible
        to all authenticated platform roles.
      operationId: getAdministrativeRegion
      parameters:
      - name: id
        in: path
        description: the unique UUID of the administrative region
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: "an Optional containing the matching AdministrativeRegion,\
            \ or empty if not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdministrativeRegion"
    put:
      summary: Updates an existing administrative region by ID.
      description: Updates an existing administrative region by ID. Restricted to
        platform administrators (`GLOBAL_ADMIN`) and regional managers (`REGIONAL_ADMIN`).
      operationId: updateAdministrativeRegion
      parameters:
      - name: id
        in: path
        description: the unique UUID of the administrative region to update
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: the updated region command data
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdministrativeRegionCommand"
        required: true
      responses:
        "200":
          description: the updated AdministrativeRegion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdministrativeRegion"
    delete:
      summary: Deletes an administrative region by its unique identifier.
      description: Deletes an administrative region by its unique identifier. Restricted
        to platform administrators (`GLOBAL_ADMIN`) and regional managers (`REGIONAL_ADMIN`).
      operationId: deleteAdministrativeRegion
      parameters:
      - name: id
        in: path
        description: the unique UUID of the administrative region to delete
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: deleteAdministrativeRegion 200 response
  /administrative-regions/{id}/boundary/ingest:
    post:
      summary: "Ingests, simplifies, and validates a geographic boundary for an administrative\
        \ region from an authoritative external source such as US Census Bureau TIGERweb."
      description: "Ingests, simplifies, and validates a geographic boundary for an\
        \ administrative region from an authoritative external source such as US Census\
        \ Bureau TIGERweb. Restricted strictly to platform administrators (`GLOBAL_ADMIN`)."
      operationId: ingestBoundary
      parameters:
      - name: id
        in: path
        description: the unique UUID of the administrative region to update
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: the boundary ingestion command containing source URL and optional
          tolerance
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestBoundaryCommand"
        required: true
      responses:
        "200":
          description: the ingestion summary response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestBoundaryResponse"
  /boundaries:
    get:
      summary: Retrieves a paginated list of geographic boundaries.
      description: Retrieves a paginated list of geographic boundaries.
      operationId: getBoundaries
      parameters:
      - name: pageable
        in: query
        description: pagination and sorting parameters
        explode: false
        schema:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/CursoredPageable"
      responses:
        "200":
          description: a cursored page of Boundary records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursoredPage_Boundary_"
    post:
      summary: Creates a new boundary polygon.
      description: Creates a new boundary polygon. Restricted to platform administrators
        (`system:admin`) and regional managers (`region:manage`).
      operationId: addBoundary
      requestBody:
        description: the payload containing boundary name and polygon coordinates
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBoundaryCommand"
        required: true
      responses:
        "200":
          description: the persisted Boundary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Boundary"
  /boundaries/{id}:
    get:
      summary: Retrieves a specific boundary by its identifier.
      description: Retrieves a specific boundary by its identifier.
      operationId: getBoundary
      parameters:
      - name: id
        in: path
        description: the unique identifier of the boundary
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: an optional containing the Boundary if found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Boundary"
    put:
      summary: Updates an existing boundary by its ID after validating that it exists.
      description: Updates an existing boundary by its ID after validating that it
        exists. Restricted to platform administrators (`system:admin`) and regional
        managers (`region:manage`). Throws 404 NOT_FOUND if the boundary does not
        exist.
      operationId: updateBoundary
      parameters:
      - name: id
        in: path
        description: the ID of the boundary to update
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: the updated boundary details
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBoundaryCommand"
        required: true
      responses:
        "200":
          description: the updated boundary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Boundary"
    delete:
      summary: Deletes a boundary by its ID after validating that it exists.
      description: Deletes a boundary by its ID after validating that it exists. Restricted
        to platform administrators (`system:admin`) and regional managers (`region:manage`).
        Throws 404 NOT_FOUND if the boundary does not exist.
      operationId: deleteBoundary
      parameters:
      - name: id
        in: path
        description: the ID of the boundary to delete
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: deleteBoundary 200 response
  /locations:
    get:
      operationId: getLocations
      parameters:
      - name: pageable
        in: query
        explode: false
        schema:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/CursoredPageable"
      responses:
        "200":
          description: getLocations 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursoredPage_Location_"
    post:
      summary: Creates a new location.
      description: Creates a new location. Restricted to platform administrators and
        regional managers.
      operationId: addLocation
      requestBody:
        description: the payload containing location details
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLocationCommand"
        required: true
      responses:
        "200":
          description: the persisted location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
  /locations/{id}:
    get:
      operationId: getLocation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: getLocation 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
    put:
      summary: Updates an existing location by its ID after validating that it exists.
      description: Updates an existing location by its ID after validating that it
        exists. Restricted to platform administrators and regional managers. Throws
        404 NOT_FOUND if the location does not exist.
      operationId: updateLocation
      parameters:
      - name: id
        in: path
        description: the ID of the location to update
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: the updated location details
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLocationCommand"
        required: true
      responses:
        "200":
          description: the updated location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
    delete:
      summary: Deletes a location by its ID after validating that it exists.
      description: Deletes a location by its ID after validating that it exists. Restricted
        to platform administrators and regional managers. Throws 404 NOT_FOUND if
        the location does not exist.
      operationId: deleteById
      parameters:
      - name: id
        in: path
        description: the ID of the location to delete
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: deleteById 200 response
  /organization-audit-logs:
    get:
      operationId: getOrganizationAuditLogs
      parameters:
      - name: pageable
        in: query
        explode: false
        schema:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/CursoredPageable"
      responses:
        "200":
          description: getOrganizationAuditLogs 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursoredPage_OrganizationAuditLog_"
  /organization-audit-logs/{id}:
    get:
      operationId: getOrganizationAuditLog
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: getOrganizationAuditLog 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationAuditLog"
  /organization-users:
    get:
      operationId: getOrganizationUsers
      parameters:
      - name: pageable
        in: query
        explode: false
        schema:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/CursoredPageable"
      responses:
        "200":
          description: getOrganizationUsers 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursoredPage_OrganizationUser_"
    post:
      operationId: addOrganizationUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationUserCommand"
        required: true
      responses:
        "200":
          description: addOrganizationUser 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationUser"
  /organization-users/{userId}/{organizationId}:
    get:
      operationId: getOrganizationUser
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: getOrganizationUser 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationUser"
    put:
      operationId: updateOrganizationUser
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationUserCommand"
        required: true
      responses:
        "200":
          description: updateOrganizationUser 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationUser"
    delete:
      operationId: deleteOrganizationUser
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: organizationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: deleteOrganizationUser 200 response
  /organizations:
    get:
      operationId: getOrganizations
      parameters:
      - name: pageable
        in: query
        explode: false
        schema:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/CursoredPageable"
      responses:
        "200":
          description: getOrganizations 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursoredPage_Organization_"
    post:
      operationId: addOrganization
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationCommand"
        required: true
      responses:
        "200":
          description: addOrganization 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
  /organizations/search-by-location:
    get:
      summary: Searches organizations by geographic coordinates and radius.
      description: "Searches organizations by geographic coordinates and radius. Finds\
        \ organizations associated with locations within `radiusMeters` of the given\
        \ point, ordered by distance ascending."
      operationId: searchByLocation
      parameters:
      - name: longitude
        in: query
        description: the longitude of the center point
        required: true
        explode: false
        schema:
          maximum: 180
          minimum: -180
          type: number
          format: double
      - name: latitude
        in: query
        description: the latitude of the center point
        required: true
        explode: false
        schema:
          maximum: 90
          minimum: -90
          type: number
          format: double
      - name: radiusMeters
        in: query
        description: the search radius in meters
        required: true
        explode: false
        schema:
          maximum: 500000
          minimum: 0
          exclusiveMinimum: true
          type: number
          format: double
      - name: pageable
        in: query
        description: pagination parameters
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: "a page of organizations within range, closest first"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page_Organization_"
  /organizations/search-by-name:
    get:
      summary: Searches organizations by name.
      description: "Searches organizations by name. Supports exact name matching when\
        \ `exact=true` or when the search query is enclosed in quotes (e.g. \"The\
        \ Salvation Army\"). Otherwise, performs an intelligent tiered ranking search\
        \ where exact matches are ranked first, followed by prefix matches, word-boundary\
        \ matches, general substring matches, and typo-tolerant trigram similarity\
        \ matches."
      operationId: searchByName
      parameters:
      - name: name
        in: query
        description: the organization name or query string
        required: true
        explode: false
        schema:
          type: string
      - name: exact
        in: query
        description: whether to force an exact case-insensitive match
        explode: false
        schema:
          type: boolean
          default: false
      - name: pageable
        in: query
        description: pagination parameters
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: a page of matching organizations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page_Organization_"
  /organizations/search-by-region:
    get:
      summary: Searches organizations associated with an administrative region.
      description: "Searches organizations associated with an administrative region.\
        \ Only returns verified, public organizations operating within the specified\
        \ region."
      operationId: searchByRegion
      parameters:
      - name: regionId
        in: query
        description: the unique identifier of the administrative region
        required: true
        explode: false
        schema:
          type: string
          format: uuid
      - name: pageable
        in: query
        description: pagination parameters
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/Pageable"
      responses:
        "200":
          description: a page of matching organizations in the region
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page_Organization_"
  /organizations/{id}:
    get:
      operationId: getOrganization
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: getOrganization 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
    put:
      summary: Updates an existing organization by its ID after validating that it
        exists.
      description: Updates an existing organization by its ID after validating that
        it exists. Throws 404 NOT_FOUND if the organization does not exist.
      operationId: updateOrganization
      parameters:
      - name: id
        in: path
        description: the ID of the organization to update
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: the updated organization command
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationCommand"
        required: true
      responses:
        "200":
          description: the updated organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
    delete:
      summary: Deletes an organization by its ID after validating that it exists.
      description: Deletes an organization by its ID after validating that it exists.
        Throws 404 NOT_FOUND if the organization does not exist.
      operationId: deleteOrganization
      parameters:
      - name: id
        in: path
        description: the ID of the organization to delete
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: deleteOrganization 200 response
