  /projects/{id}/status:
    put:
      summary: Endpoint for Regional Admins to approve a pending project.
      description: Endpoint for Regional Admins to approve a pending project. The
        service layer enforces that the Regional Admin actually has geographic jurisdiction.
      operationId: approveProject
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: approveProject 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /region-users:
    get:
      summary: Retrieves a paginated list of regional user associations.
      description: Retrieves a paginated list of regional user associations.
      operationId: getRegionUsers
      parameters:
      - name: pageable
        in: query
        description: pagination and sorting parameters
        explode: false
        schema:
          nullable: true
          allOf:
          - $ref: "#/components/schemas/CursoredPageable"
      responses:
        "200":
          description: a cursored page of RegionUser records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CursoredPage_RegionUser_"
    post:
      summary: Associates a user with an administrative region under a designated
        role.
      description: Associates a user with an administrative region under a designated
        role. Restricted to platform administrators (`system:admin`) and regional
        managers (`region:manage`).
      operationId: addRegionUser
      requestBody:
        description: "the payload containing the target user ID, region ID, and role"
        content:
          application/json:
            schema:
