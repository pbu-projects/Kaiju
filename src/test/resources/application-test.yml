datasources:
  default:
    url: jdbc:tc:postgis:15-3.5:///volunteer_monster
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    db-type: postgres

micronaut:
  executors:
    io:
      type: THREAD_PER_TASK
      virtual: true
    blocking:
      type: THREAD_PER_TASK
      virtual: true
  security:
    enabled: true
    reject-not-found: false
    oauth2:
      enabled: false
    token:
      jwt:
        enabled: true
        signatures:
          secret:
            generator:
              secret: pleaseChangeThisSecretForANewOne32Bits

test-resources:
  containers:
    postgres:
      image-name: postgis/postgis:15-3.5
      db-name: volunteer_monster
      username: jimmy
      password: warm-farts-smell-worse
    postgis:
      image-name: postgis/postgis:15-3.5
      db-name: volunteer_monster
      username: jimmy
      password: warm-farts-smell-worse
    keycloak:
      enabled: false

