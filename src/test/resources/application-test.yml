datasources:
  default:
    url: jdbc:tc:postgis:15-3.5:///volunteer_monster
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    db-type: postgres

micronaut:
  security:
    enabled: true
    reject-not-found: false
    oauth2:
      enabled: false
    token:
      jwt:
        enabled: true
        signatures:
          secret:
            generator:
              secret: pleaseChangeThisSecretForANewOne32Bits

test-resources:
  containers:
    keycloak:
      enabled: false

